name: Taco Dip
links:
- https://www.youtube.com/watch?v=-tfR6R95Tdo
categories:
- Favorite
notes:
- Ben loves it!
versions:
- ingredients:
  - 1 onion
  - 2 bell peppers, red and yellow, or any color
  - 1 pound lean meat, beef preferred, turkey, chicken, or vegan meat work too
  - 1 packet taco seasoning
  - 16oz tub low fat cottage cheese
  - shredded cheddar cheese
  - (optional) 2 slices american cheese
  - (optional) additional garlic powder, chili powder, salt
  instructions:
  - Dice onion, cook it down
  - Add meat, cook it down
  - Add diced bell peppers, cook it down
  - Add taco seasoning, cook a bit
  - Add tub of cottage cheese, mix well until chunks dispersed
  - top with cheddar cheese, serve with chips or tortillas
