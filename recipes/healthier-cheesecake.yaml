name: Healthier Cheesecake
links:
- https://thebigmansworld.com/healthy-cheesecake/
categories:
- Favorite
- Dessert
notes:
- This recipe rocks!
versions:
- ingredients:
  - 2 pie crusts
  - 2 blocks reduced fat cream cheese
  - 1 32oz tub non fat light vanilla greek yogurt (Add vanilla if plain)
  - egg whites (about 4 eggs worth), or use real eggs
  - 2 cups sugar substitute
  - 1/2 cup flour
  - 1/2 tsp salt
  instructions:
  - Mix, put into pie crusts
  - Bake at 325F for 65 minutes
  - Remove and let it cool
  - Place in fridge
