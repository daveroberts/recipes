categories:
- Dessert
notes:
versions:
- ingredients:
  - 1 bag frozen strawberries (or other fruit)
  - 2 tbsp chia seeds
  - lemon juice
  - sweetener (sucralose or honey or maple syrup or sugar
  instructions:
  - In a saute pan, cook down straberries, add lemon juice and chia seeds, mash gently
  - Let it cool
  - Blend with sweetener
